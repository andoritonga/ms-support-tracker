    <!-- MODAL POP-UP 1: ADD NEW ACTIVITY -->
    <div id="addModal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-drag-handle"></div>
            <div class="modal-header">
                <div class="modal-title">New Activity Log</div>
                <button class="btn-secondary" style="padding: 4px 10px;" onclick="closeAddModal()">✕</button>
            </div>

            <!-- TIME INPUT MODE SELECTOR: MANUAL (BACKDATE) VS TIMER -->
            <div class="time-mode-selector">
                <button type="button" class="time-mode-btn active" id="modeManualBtn" onclick="switchTimeMode('manual')">
                    <span>✍️</span> Manual Add (Backdate)
                </button>
                <button type="button" class="time-mode-btn" id="modeTimerBtn" onclick="switchTimeMode('timer')">
                    <span>⏱️</span> Live Stopwatch / Timer
                </button>
            </div>

            <div class="grid">
                <div>
                    <label>Customer</label>
                    <select id="customer" onchange="handleCustomerChange(this)"></select>
                </div>

                <div>
                    <label>Date</label>
                    <input type="date" id="startDate" />
                </div>

                <div>
                    <label>Raised By</label>
                    <select id="raisedBy" onchange="handleRaisedByChange(this)"></select>
                </div>

                <div>
                    <label>Services</label>
                    <select id="services">
                        <option value="Google Cloud">Google Cloud</option>
                        <option value="Alibaba Cloud">Alibaba Cloud</option>
                        <option value="Zoom">Zoom</option>
                        <option value="VOD">VOD</option>
                    </select>
                </div>

                <div>
                    <label>Category</label>
                    <select id="category">
                        <option value="Issue">Issue</option>
                        <option value="Support">Support</option>
                        <option value="Others">Others</option>
                    </select>
                </div>

                <div>
                    <label>GCP / Project ID</label>
                    <input type="text" id="project" placeholder="e.g. prj-msig-legacy" list="projectList" />
                    <datalist id="projectList"></datalist>
                </div>

                <div>
                    <label>Status</label>
                    <select id="status">
                        <option value="In Progress">In Progress</option>
                        <option value="Closed">Closed</option>
                    </select>
                </div>

                <!-- MSIG TICKET EVALUATION HELPER (ADD) -->
                <div class="full" id="msigAddHelper" style="display: none; background: rgba(59, 130, 246, 0.08); border: 1px solid rgba(59, 130, 246, 0.25); border-radius: 10px; padding: 10px 14px; margin-top: 4px;">
                    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;">
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <span style="font-size: 18px;">🎫</span>
                            <div>
                                <strong style="color: var(--primary); font-size: 12.5px;" id="contractAddHelperTitle">Potong Kuota Tiket MSIG:</strong>
                                <span id="msigAddReasonText" style="font-size: 11.5px; color: var(--muted); margin-left: 6px;">Tentukan kuota tiket untuk log ini</span>
                            </div>
                        </div>
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <select id="ticketDeduction" style="padding: 5px 10px; font-weight: 700; border-radius: 6px; border: 1.5px solid var(--primary); background: var(--bg); color: var(--text); font-size: 12.5px; cursor: pointer;">
                                <option value="0">⚪ 0 Tiket (Free / Inquiry)</option>
                                <option value="0.5">🎫 0.5 Tiket (Changes ≤ 4h)</option>
                                <option value="1.0">🎫 1.0 Tiket (Issue / Changes > 4h)</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="full" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: -4px;">
                    <label style="margin: 0;">Task Description</label>
                    <div style="display: flex; gap: 8px;">
                        <button type="button" class="btn-kb-inline" id="btnKbSearchAdd" onclick="triggerKbSearch('add')" title="Search Knowledge Base for past similar solutions">
                            <span>💡</span> Past Solutions
                        </button>
                        <button type="button" class="btn-ai-inline" id="btnPolishAdd" onclick="polishFormWithAI('add')" title="Use Gemini AI to polish and improve grammar & clarity">
                            <span>✨</span> Polish Notes with AI
                        </button>
                    </div>
                </div>
                <div class="full" style="margin-top: 0;">
                    <textarea id="taskDescription" rows="3"
                        placeholder="Explain activity or issue details (auto-suggests past solutions as you type)..." oninput="debounceKbSearch('add')"></textarea>
                    <!-- KNOWLEDGE BASE AUTO-SUGGEST PANEL -->
                    <div id="kbSuggestionsAdd" class="kb-suggestions-container" style="display: none;"></div>
                </div>

                <div class="full">
                    <label>Root Cause</label>
                    <textarea id="rootCause" rows="2" placeholder="Analyze the underlying cause..."></textarea>
                </div>

                <div class="full">
                    <label>Solution</label>
                    <textarea id="solution" rows="2" placeholder="Action taken or resolution steps..."></textarea>
                </div>

                <!-- OPTION 1: MANUAL CLOCK IN / CLOCK OUT (DEFAULT FOR BACKDATING) -->
                <div id="manualClockInBox">
                    <label>Clock In</label>
                    <input type="datetime-local" id="clockIn" />
                </div>

                <div id="manualClockOutBox">
                    <label>Clock Out</label>
                    <input type="datetime-local" id="clockOut" />
                </div>

                <!-- OPTION 2: LIVE STOPWATCH / TIMER PANEL -->
                <div id="timerPanelBox" class="full" style="display: none;">
                    <div class="modal-timer-box" id="modalTimerBox">
                        <div class="modal-timer-header">
                            <div class="modal-timer-status">
                                <span class="status-dot"></span>
                                <span id="modalTimerStatusText">Timer Ready</span>
                            </div>
                            <div class="modal-timer-timestamps" id="modalTimerTimestamps">Click Start to begin tracking this task</div>
                        </div>
                        <div class="modal-timer-display" id="modalTimerDisplay">00:00:00</div>
                        <div class="modal-timer-actions">
                            <button type="button" id="btnModalTimerStart" class="btn-timer-start-lg" onclick="startModalTimer()">
                                <span>▶</span> Start Timer
                            </button>
                            <button type="button" id="btnModalTimerStop" class="btn-timer-stop-lg" onclick="stopModalTimer()" style="display: none;">
                                <span>⏹</span> Stop & Set Time
                            </button>
                            <button type="button" id="btnModalTimerReset" class="btn-secondary" style="padding: 8px 16px; font-size: 12px; display: none;" onclick="resetModalTimer()">
                                🔄 Reset
                            </button>
                        </div>
                    </div>
                </div>

                <div class="full">
                    <label>Remarks</label>
                    <textarea id="remarks" rows="2" placeholder="Additional notes..."></textarea>
                </div>
            </div>

            <div id="loading" class="loading" style="margin-top: 16px;">
                <div class="spinner"></div>
                Processing data...
            </div>

            <div class="actions">
                <div id="msg" class="msg"></div>
                <div>
                    <button class="btn-secondary" onclick="closeAddModal()">Cancel</button>
                    <button onclick="submitForm()">Submit Activity</button>
                </div>
            </div>
        </div>
    </div>
