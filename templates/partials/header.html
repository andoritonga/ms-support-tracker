        <!-- HEADER -->
        <div class="header">
            <div class="header-left">
                <img id="appLogo" class="logo"
                    src="/static/logo-xlsmart.png"
                    alt="Logo" />
                <div>
                    <div class="title">MS Support Activity Tracker</div>
                    <div class="subtitle">Cloud Operations – Managed Service Support Logging System</div>
                </div>
            </div>
            <div class="header-controls">
                <button class="btn-client-report" onclick="openClientReportModal()" title="Generate weekly customer performance & issue health report">
                    <span>📑</span> <span>Weekly Customer Report</span>
                </button>
                <button class="theme-toggle" id="btnSyncStatus" onclick="triggerManualSync()" title="Click to trigger background sync with Google Sheets">
                    <span id="syncIcon">☁️</span> <span id="syncText">Synced</span>
                </button>
                <button class="btn-add-activity" id="btnAddActivity" onclick="openAddModal()">
                    <span class="icon-plus">+</span>
                    <span id="btnAddActivityText">Add Activity</span>
                </button>
                <button class="theme-toggle" onclick="toggleDarkMode()">
                    <span id="themeIcon">🌙</span> <span id="themeText">Dark</span>
                </button>
                <div id="authUserPill" class="theme-toggle" style="display: none; cursor: default; background: rgba(16, 185, 129, 0.1); border-color: rgba(16, 185, 129, 0.35); color: var(--text);" title="Currently signed-in user">
                    <span style="font-size: 10px;">🟢</span>
                    <span id="authUsernameText" style="font-weight: 800;">User</span>
                </div>
                <button class="theme-toggle" id="btnLogout" onclick="logoutUser()" style="display: none; border-color: rgba(239, 68, 68, 0.35); color: #ef4444;" title="Sign out of current session">
                    <span>🚪</span> <span id="logoutUserText">Logout</span>
                </button>
            </div>
        </div>
